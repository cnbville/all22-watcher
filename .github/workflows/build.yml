name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Mac app
        run: npm run dist
        env:
          # The app isn't signed with an Apple Developer ID yet.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke test the packaged app
        run: npm run smoke
        env:
          APP: dist/mac-arm64/All-22 Watcher.app/Contents/MacOS/All-22 Watcher
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: e2e/output/
      - uses: actions/upload-artifact@v4
        with:
          name: All-22-Watcher-mac-apple-silicon
          path: dist/*-arm64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: All-22-Watcher-mac-intel
          path: |
            dist/*.dmg
            !dist/*-arm64.dmg
          if-no-files-found: error
